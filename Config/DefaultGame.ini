; BaseItem_DT / BaseWeapon_DT / BaseArmor_DT / ItemModifier_DT are only ever loaded via
; LoadObject() with a hardcoded path (CoreMenu.cpp, ItemHandler.cpp), which the cooker can't
; see as a reference, so they were being stripped from packaged builds and crashing on launch
; (RandomizeShopItems indexing an empty row-name array). Forcing the directory to always cook
; fixes it without having to convert every LoadObject call to a UPROPERTY reference.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/ItemData")
